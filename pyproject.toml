[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "comparator"
version = "0.2.0"
description = "Compare a source directory with a target directory and sync the differences one way, with a preview first."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ckjackslack" }]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: System :: Archiving :: Mirroring",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
comparator = "comparator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
